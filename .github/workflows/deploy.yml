name: Deploy to chepti.com/tasks

# כל דחיפה ל-main (מהמחשב, מהסלולרי, מכל מקום) מפרסמת אוטומטית לשרת.
# אפשר גם ידנית: Actions -> Deploy -> Run workflow.
#
# איך זה עובד: Hostinger חוסם SSH מכתובות של GitHub Actions, לכן ה-workflow רק קורא ב-HTTPS
# ל-deploy.php באתר, והשרת מושך את הקוד בעצמו מ-GitHub (ראו הסבר בראש deploy.php).
# הסוד DEPLOY_TOKEN (Settings -> Secrets and variables -> Actions) חייב להתאים ל-$DEPLOY_TOKEN ב-api/config.php בשרת.
# api/config.php, קובץ הנתונים ו-pub/ לעולם לא נוגעים בהם.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # הגנה: רק הריפו המקורי יפרוס לשרת
    if: github.repository == 'chepti/Tasks'
    steps:
      - name: Call deploy endpoint
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -u
          for i in 1 2 3; do
            code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 150 -X POST \
              -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
              --data-urlencode "sha=${GITHUB_SHA}" \
              https://chepti.com/tasks/deploy.php) || code=000
            cat resp.json || true; echo
            if [ "$code" = "200" ]; then exit 0; fi
            echo "attempt $i failed (HTTP $code)"; sleep 10
          done
          echo "::error::deploy failed (last HTTP $code)"
          exit 1
