<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>המשימות שלי</title>
<meta name="description" content="מערכת משימות אישית בהשראת GTD">
<meta name="theme-color" content="#FFF8F0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=25">
</head>
<body>

<!-- מסך כניסה -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="login-logo" id="login-logo"></div>
    <h1>המשימות שלי</h1>
    <p class="login-sub">מה עושים עכשיו?</p>
    <form id="login-form">
      <input type="password" id="login-password" placeholder="סיסמה" autocomplete="current-password">
      <button type="submit" class="btn btn-primary btn-lg">כניסה</button>
    </form>
    <p id="login-error" class="login-error hidden">הסיסמה לא נכונה, נסי שוב</p>
  </div>
</div>

<!-- האפליקציה -->
<div id="app" class="app hidden">

  <header class="topbar">
    <div class="topbar-title">
      <span id="greeting">בוקר טוב</span>
      <button id="offline-badge" class="offline-badge hidden" type="button"></button>
    </div>
    <nav class="topnav" id="topnav"></nav>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-select" title="בחירה מרובה"></button>
      <button class="icon-btn" id="btn-search" title="חיפוש בכל המערכת"></button>
      <button class="icon-btn" id="btn-history" title="היסטוריה"></button>
      <button class="icon-btn" id="btn-settings" title="הגדרות"></button>
    </div>
  </header>

  <main id="main" class="main"></main>

  <footer class="app-footer">
    <a class="footer-credit" href="https://chepti.com" target="_blank" rel="noopener">
      <span id="footer-mark"></span>
      <span>חולמים תקשוב</span>
    </a>
    <button class="btn btn-ghost footer-feedback" id="btn-feedback">
      <span id="footer-fb-icon"></span> משוב
    </button>
  </footer>

  <nav class="bottomnav" id="bottomnav"></nav>

  <button class="fab" id="fab" title="משימה חדשה"></button>

  <!-- סרגל פעולות על כמה משימות שנבחרו -->
  <div class="bulk-bar hidden" id="bulk-bar">
    <span class="bulk-count" id="bulk-count"></span>
    <div class="bulk-actions">
      <button class="btn btn-primary" id="bulk-complete" title="סימון כבוצע"></button>
      <button class="btn btn-ghost" id="bulk-edit" title="הגדרות לכולן"></button>
      <button class="btn btn-danger" id="bulk-drop" title="מחיקה"></button>
      <button class="btn btn-ghost" id="bulk-cancel" title="ביטול בחירה"></button>
    </div>
  </div>
</div>

<!-- גיליון עריכת משימה -->
<div class="sheet-backdrop hidden" id="sheet-backdrop"></div>
<div class="sheet hidden" id="task-sheet"></div>

<!-- מודאל כללי (היסטוריה / הדבקה / הגדרות / פרויקט) -->
<div class="modal-backdrop hidden" id="modal-backdrop">
  <div class="modal" id="modal"></div>
</div>

<div id="toast" class="toast hidden"></div>
<canvas id="confetti-canvas"></canvas>

<script src="js/app.js?v=25"></script>
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (reloading) return;
    reloading = true;
    location.reload();
  });
  navigator.serviceWorker.getRegistrations().then(function (regs) {
    return Promise.all(regs.map(function (r) {
      var path = (r.scope || '').replace(location.origin, '');
      if (path === '/' || path === '') return r.unregister();
    }));
  }).then(function () {
    return navigator.serviceWorker.register('sw.js', { scope: './' });
  }).then(function (reg) {
    if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    reg.addEventListener('updatefound', function () {
      var nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', function () {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) {
          nw.postMessage({ type: 'SKIP_WAITING' });
        }
      });
    });
  }).catch(function () {});
})();
</script>
</body>
</html>
